    <script>if(location.hostname.endsWith('github.io')){const p=location.pathname.split('/').filter(Boolean)[0]||'';const b=p?`/${p}/`:'/';const r=location.pathname+location.search+location.hash;location.replace(`${b}?redirect=${encodeURIComponent(r)}`)}</script>
