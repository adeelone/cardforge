server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # This container only terminates plain HTTP — TLS is expected to be
  # terminated by an edge proxy/load balancer in front of it (the standard
  # pattern for containerized deployments; see README's Docker section).
  # If that proxy forwards the original scheme, bounce any plaintext hop to
  # HTTPS instead of silently serving it.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-dM44nUd1PqvDXf9e3F8a00QoPA7LVy50Kx0AOqxNiQk=' 'sha256-A/9kTkHHw0rcTSJxkRxgceFU+ODBMj2RNe2EtqeazNA='; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; worker-src 'self' blob:; manifest-src 'self'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  location ~ ^/(design|c|checkout)/[^/]+/?$ {
    try_files $uri /app.html;
    expires -1;
  }

  location / {
    try_files $uri $uri/ =404;
    expires -1;
  }

  location = /sw.js {
    try_files $uri =404;
    expires epoch;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }
}
